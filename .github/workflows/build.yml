{"name": "Build APK", "on": {"push": null, "workflow_dispatch": null}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "android-actions/setup-android@v3"}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.9"}}, {"name": "Build", "run": "unzip -q LiveImager.zip && cd LiveImager && gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../LiveImager.apk"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "LiveImager-apk", "path": "LiveImager.apk"}}]}}}
