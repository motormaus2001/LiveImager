name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Show files
        run: find . -path ./.git -prune -o -type f -print
      - name: Build
        run: |
          if [ -f LiveImager/settings.gradle ]; then cd LiveImager; fi
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/LiveImager.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LiveImager-apk
          path: LiveImager.apk
